<!doctype html>
<!-- Stand-in for Meet: asks for the camera the way Meet does and shows the result. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fake Meet</title>
  </head>
  <body style="margin: 0; background: #202124">
    <video id="v" autoplay muted playsinline width="640" height="360"></video>
    <script>
      window.ready = (async () => {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720 },
          audio: true,
        });
        const video = document.getElementById('v');
        video.srcObject = stream;
        await video.play();
        const track = stream.getVideoTracks()[0];
        return {
          label: track.label,
          settings: track.getSettings(),
          trackCount: stream.getTracks().length,
        };
      })();

      // PNG of the current frame of the stream the "call" is sending.
      window.grab = () => {
        const video = document.getElementById('v');
        const c = document.createElement('canvas');
        c.width = video.videoWidth;
        c.height = video.videoHeight;
        c.getContext('2d').drawImage(video, 0, 0);
        return c.toDataURL('image/png');
      };
    </script>
  </body>
</html>
